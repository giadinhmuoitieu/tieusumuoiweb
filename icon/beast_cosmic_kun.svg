<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="kunBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0c071a"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a29bfe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6c5ce7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4834d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70a1ff"/>
      <stop offset="40%" stop-color="#9b59b6"/>
      <stop offset="80%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <filter id="cosmicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="20" fill="url(#kunBg)"/>

  <!-- Celestial Constellation Rings -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#6c5ce7" stroke-width="1.5" opacity="0.3"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#a29bfe" stroke-width="2" stroke-dasharray="10 6" opacity="0.5"/>
  <circle cx="250" cy="250" r="185" fill="url(#purpleGlow)"/>

  <!-- Starry Dots -->
  <circle cx="120" cy="110" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="390" cy="140" r="3" fill="#70a1ff" opacity="0.9"/>
  <circle cx="150" cy="380" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="360" cy="360" r="3.5" fill="#e056fd" opacity="0.9"/>
  <circle cx="280" cy="90" r="2" fill="#fff" opacity="0.6"/>

  <!-- Cosmic Kun Figure -->
  <g transform="translate(250, 240)" filter="url(#cosmicGlow)">
    <!-- Swirling Void Waves -->
    <path d="M-180,60 C-100,-40 100,-40 180,60 C120,120 -120,120 -180,60 Z" fill="none" stroke="#70a1ff" stroke-width="2" opacity="0.4"/>
    
    <!-- Kun Body Curve -->
    <path d="M-130,40 C-80,-70 50,-80 140,-20 C110,30 40,60 -30,65 C-80,70 -115,55 -130,40 Z" fill="url(#cosmicGrad)"/>
    
    <!-- Kun Giant Wings / Fins -->
    <path d="M-30,-20 C-60,-110 -130,-100 -120,-40 C-80,-40 -50,-25 -30,-20 Z" fill="#6c5ce7" opacity="0.85"/>
    <path d="M30,15 C90,110 160,80 130,25 C90,20 60,18 30,15 Z" fill="#4834d4" opacity="0.85"/>
    
    <!-- Tail Fin (Fluke) -->
    <path d="M-130,40 C-160,20 -190,45 -180,75 C-160,65 -145,55 -130,40 Z" fill="#9b59b6"/>
    <path d="M-130,40 C-155,60 -170,95 -150,115 C-140,85 -135,60 -130,40 Z" fill="#8e44ad"/>

    <!-- Glowing Eye & Dorsal Luminescence -->
    <circle cx="105" cy="-22" r="5" fill="#00f0ff" filter="url(#cosmicGlow)"/>
    <circle cx="105" cy="-22" r="2" fill="#fff"/>
    <path d="M-80,30 C-20,38 30,25 75,-5" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4 8" opacity="0.8"/>
  </g>

  <!-- Title Banner on bottom -->
  <rect x="90" y="430" width="320" height="38" rx="19" fill="#130826" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="250" y="455" text-anchor="middle" fill="#e056fd" font-family="'Philosopher', serif" font-weight="700" font-size="18" letter-spacing="2">
    BÁT HOANG CỰ CÔN • ĐẶC THÙ
  </text>
</svg>
