<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="60%" stop-color="#140d04"/>
      <stop offset="100%" stop-color="#080502"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fdcb6e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="30%" stop-color="#f1c40f"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Outer Sacred Circles -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="250" cy="250" r="190" fill="url(#goldGlow)"/>

  <!-- Energy Barrier Shield -->
  <polygon points="250,55 390,135 390,320 250,445 110,320 110,135" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <polygon points="250,75 370,145 370,305 250,415 130,305 130,145" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.7"/>

  <!-- Celestial Pixiu Figure Silhouette & Emblems -->
  <g transform="translate(250, 245)" filter="url(#glow)">
    <!-- Aura Rays -->
    <path d="M0,-140 L0,-170 M99,-99 L120,-120 M140,0 L170,0 M99,99 L120,120 M0,140 L0,170 M-99,99 L-120,120 M-140,0 L-170,0 M-99,-99 L-120,-120" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Pixiu Horn & Crown -->
    <path d="M0,-120 C-15,-95 -25,-60 0,-30 C25,-60 15,-95 0,-120 Z" fill="url(#goldGrad)"/>
    <path d="M-25,-90 C-45,-75 -50,-45 -25,-30 C-15,-50 -10,-75 -25,-90 Z" fill="url(#goldGrad)"/>
    <path d="M25,-90 C45,-75 50,-45 25,-30 C15,-50 10,-75 25,-90 Z" fill="url(#goldGrad)"/>
    
    <!-- Pixiu Face & Mane -->
    <path d="M-70,-10 C-90,20 -60,60 -30,70 C-45,50 -50,20 -30,0 Z" fill="url(#goldGrad)"/>
    <path d="M70,-10 C90,20 60,60 30,70 C45,50 50,20 30,0 Z" fill="url(#goldGrad)"/>
    
    <!-- Pixiu Eyes -->
    <ellipse cx="-28" cy="-25" rx="10" ry="6" fill="#fff" transform="rotate(-10 -28 -25)"/>
    <ellipse cx="28" cy="-25" rx="10" ry="6" fill="#fff" transform="rotate(10 28 -25)"/>
    <circle cx="-28" cy="-25" r="4" fill="#d35400"/>
    <circle cx="28" cy="-25" r="4" fill="#d35400"/>

    <!-- Lion Snout & Fangs -->
    <path d="M-25,-5 C-25,20 25,20 25,-5 C15,-12 -15,-12 -25,-5 Z" fill="#fff6cc"/>
    <polygon points="-16,10 -12,25 -8,10" fill="#fff"/>
    <polygon points="16,10 12,25 8,10" fill="#fff"/>
    
    <!-- Ancient Fortune Coin at Core -->
    <circle cx="0" cy="55" r="45" fill="url(#goldGrad)" stroke="#ffeaa7" stroke-width="2"/>
    <rect x="-14" y="41" width="28" height="28" fill="#140d04" stroke="#ffeaa7" stroke-width="2"/>
    <circle cx="0" cy="55" r="35" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- Title Banner on bottom -->
  <rect x="90" y="430" width="320" height="38" rx="19" fill="#1f1406" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="250" y="455" text-anchor="middle" fill="#ffeaa7" font-family="'Philosopher', serif" font-weight="700" font-size="18" letter-spacing="2">
    TỲ HƯU CHIÊU TÀI • PHÒNG THỦ
  </text>
</svg>
